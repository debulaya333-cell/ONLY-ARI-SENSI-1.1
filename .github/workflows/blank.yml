name: Build ONLY ARI SENSI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          unzip -q OnlyAriSensiNative.zip -d extracted
          ls -la extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/OnlyAriSensiNative
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONLY-ARI-SENSI-APK
          path: extracted/OnlyAriSensiNative/app/build/outputs/apk/debug/*.apk
